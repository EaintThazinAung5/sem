name: A workflow for my Hello World App

on: push

jobs:
  build:
    name: Hello world action
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'

      - name: Setup network
        run: |
          docker network create --driver bridge se-methods
          docker pull mongodb/mongodb-community-server:latest
          docker run -d --name mongo-dbserver --network se-methods mongodb/mongodb-community-server:latest

      - name: Build with Maven
        run: mvn package

      - name: Build Docker image
        run: docker build -t semimage .

      - name: Run image
        run: docker run --network se-methods --name devopscontainer semimage

      - name: View logs
        run: docker logs devopscontainer